plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${minecraft_version}-${mod_major_version}." + (hasProperty('CIVersion') ? CIVersion : mod_version) + '-BETA'
group = 'io.github.jodlodi.minions_remastered'
base.archivesName = 'minions_remastered'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', 'minions_remastered', '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
    mods {
        minions_remastered { sourceSet sourceSets.main }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.pdn'
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'minions_remastered',
                'Specification-Vendor': 'minions_remasteredsareus',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'minions_remasteredsareus'
        ])
    }
}

def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream { stream -> secrets.load(stream) }
    fileTree('secrets').matching { include '**/*.properties' }.each { File secretFile ->
        secretFile.withInputStream { stream -> secrets.load(stream) }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'jodlodi'
            artifactId = 'minions_remastered'
        }
    }
    repositories {
        maven {
            url = 'https://maven.tamaized.com/releases'
            credentials {
                username = hasProperty('CIMUser') ? CIMUser : secrets.getProperty('maven_username')
                password = hasProperty('CIMToken') ? CIMToken : secrets.getProperty('maven_password')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
